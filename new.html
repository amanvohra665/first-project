  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy Now</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:1000px;
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .product-image{
      background:#f0f0f0;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .product-image img{
      width:100%;
      max-width:350px;
    }

    .product-details{
      padding:40px;
    }

    .product-title{
      font-size:32px;
      margin-bottom:15px;
      color:#222;
    }

    .product-description{
      color:#666;
      line-height:1.6;
      margin-bottom:20px;
    }

    .price{
      font-size:28px;
      color:#27ae60;
      margin-bottom:20px;
      font-weight:bold;
    }

    .quantity{
      margin-bottom:25px;
    }

    .quantity label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .quantity input{
      width:80px;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    .buy-btn{
      width:100%;
      padding:15px;
      background:#000;
      color:#fff;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .buy-btn:hover{
      background:#27ae60;
    }

    .features{
      margin-top:30px;
    }

    .features h3{
      margin-bottom:10px;
    }

    .features ul{
      list-style:none;
    }

    .features li{
      margin-bottom:8px;
      color:#555;
    }

    @media(max-width:768px){
      .container{
        grid-template-columns:1fr;
      }

      .product-details{
        padding:25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="product-image">
      <img src="https://via.placeholder.com/350" alt="Product">
    </div>

    <div class="product-details">

      <h1 class="product-title">Wireless Headphones</h1>

      <p class="product-description">
        Experience premium sound quality with these stylish wireless headphones.
        Long battery life, noise cancellation, and comfortable design.
      </p>

      <div class="price">$99.99</div>

      <div class="quantity">
        <label>Quantity</label>
        <input type="number" value="1" min="1">
      </div>

      <button class="buy-btn">
        Buy Now
      </button>

      <div class="features">
        <h3>Features</h3>

        <ul>
          <li>✔ Noise Cancellation</li>
          <li>✔ 20 Hours Battery</li>
          <li>✔ Bluetooth 5.0</li>
          <li>✔ Fast Charging</li>
        </ul>
      </div>

    </div>

  </div>

</body>
</html>
