<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>the Grosary store</title>

  <style>
    .header {
      background-color:rgb(240, 230, 230);
      color:black;
      padding: 20px 20px;
      text-align: center;
      height: 100px;
    }

    .nav {
      background-color: whitesmoke;
      text-align: center;
      padding: 10px;
    }

    .nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      transition: color 0.3s;
    }

    .nav a:hover {
      color: #00ff80;
    }



    .products {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
      text-align: center;

    }

    .card {



      width: 300px;
      padding-top: 15px;
      padding-bottom: 0%;
      padding-right: 5px;

      background: wheat;
      border: 1px solid white;
      border-radius: 10px;
      box-shadow: 0 4px 5px rgb(78, 78, 83);
      transition: transform 1s, box-shadow 0.5s;

    }

    .card:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 12px darkblue;
    }





    .footer {
      background: grey;
      color: white;
      text-align: center;
      height: 50px;
      margin-top: 70px;
      margin-bottom: 1px;
      padding-top: 13px;

    }

    body {
      background-color: whitesmoke;
      margin: 0;
    }

    .banner {
      border: 2px solid white;
      overflow: hidden;
      border-radius: 20px;
      margin-left: 300px;
      margin-right: 300px;
      margin-top: 10px;

    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body>


  <div class="header">
    <h1>walmart </h1>
    <p>Shop smart, live fresh</p>
  </div>


  <div class="nav">
    <a href="web.html">Home</a>
    <a href="products.html">Shop/Products</a>
    <a href="about.html">about us</a>

  </div>





  <div class="banner">
    <img src="img/banner.jpg" height="500px" width="1700px" a alt=" ">
    <a href=""></a>

  </div>
  </div>



  <div class="products">
    <div class="card">
      <img src="img/pexels-olia-danilevich-5418665.jpg" height="150px" width="200px" alt="">
      <a href="products.html">
        <h3>Fruits</h3>
      </a>

    </div>
    <div class="card">
      <img src="img/vegitables.jpg" height="150px" alt="Vegetables">
      <a href="products.html">
        <h3>Vegetables</h3>
      </a>

    </div>
    <div class="card">
      <img src="img/dheiueuwhiuewgewu.jpg" height="150px" alt="Dairy">
      <a href="products.html">
        <h3>Dairy</h3>
      </a>

    </div>
    <div class="card">
      <img src="img/daily snacks.jpg" height="150px" alt="Snacks">
      <a href="products.html">
        <h3>Snacks</h3>
      </a>

    </div>
    <div class="card">
      <img src="img/liqure.jpg" height="150px" alt="">
      <a href="products.html">
        <h3>liqure</h3>
      </a>

    </div>
  </div>
  <div class="footer">
    <p>&copy; 2026 Grosary store | All Rights Reserved</p>
  </div>

</body>

</html>
